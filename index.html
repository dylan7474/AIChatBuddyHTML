<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive AI Buddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Advanced Avatar Animations --- */
        @keyframes float-complex {
            0% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-12px) rotate(1deg); }
            66% { transform: translateY(-5px) rotate(-1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .avatar-container {
            animation: float-complex 8s ease-in-out infinite;
            perspective: 1000px;
        }

        /* Aura & Glows */
        @keyframes pulse-aura {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
            100% { transform: scale(1); opacity: 0.3; }
        }
        .aura {
            transform-origin: center;
            animation: pulse-aura 4s ease-in-out infinite;
            transition: fill 0.4s ease;
        }

        /* Visor Styles */
        .visor-glass {
            transition: all 0.4s ease;
        }

        /* State: Listening */
        .listening .aura { fill: #10b981; animation-duration: 2s; }
        .listening .visor-glass { stroke: #10b981; stroke-width: 3px; filter: drop-shadow(0 0 15px rgba(16,185,129,0.5)); }

        /* State: Thinking (the eyes' looking about is done in JS) */
        .thinking .aura { fill: #8b5cf6; animation-duration: 1.5s; }
        .thinking .visor-glass { stroke: #8b5cf6; filter: drop-shadow(0 0 15px rgba(139,92,246,0.5)); }

        /* State: Speaking */
        .speaking .visor-glass { stroke: #38bdf8; filter: drop-shadow(0 0 12px rgba(56,189,248,0.35)); }

        /* The head's tilt, the eyes, lids, brows, cheeks and mouth are all set every frame from JS */
        #avatar-svg { transform-style: preserve-3d; }

        /* Chat scrollbar */
        #chat-log::-webkit-scrollbar { width: 6px; }
        #chat-log::-webkit-scrollbar-track { background: transparent; }
        #chat-log::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 20px; }

        /* Status Dot */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-idle { background-color: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
        .status-listening { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-speaking { background-color: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
        .status-thinking { background-color: #8b5cf6; box-shadow: 0 0 8px #8b5cf6; }
        .status-error { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
    </style>
</head>
<body class="flex flex-col items-center justify-between">

    <!-- Top Bar -->
    <header class="w-full p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex justify-between items-center z-10">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-robot text-blue-400 text-xl"></i>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">Gemini AI Buddy</h1>
        </div>
        <div class="flex items-center text-sm font-medium text-slate-300">
            <span id="status-indicator" class="status-dot status-idle"></span>
            <span id="status-text">Idle</span>
            <button id="key-btn" class="ml-4 text-slate-400 hover:text-blue-400" title="Gemini API key"><i class="fa-solid fa-key"></i></button>
            <button id="settings-btn" class="ml-3 text-slate-400 hover:text-blue-400" title="Voice and settings"><i class="fa-solid fa-sliders"></i></button>
        </div>
    </header>

    <!-- API Key Bar (shown when no key is saved) -->
    <form id="key-form" class="hidden w-full max-w-4xl px-4 py-3 flex flex-wrap items-center gap-2 text-sm text-slate-300">
        <label for="key-input">Gemini API key:</label>
        <input id="key-input" type="password" autocomplete="off" placeholder="Paste your key from aistudio.google.com" class="flex-1 min-w-[12rem] bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg px-4 py-2">Save</button>
        <span class="w-full text-xs text-slate-500">Stored only in this browser.</span>
    </form>
    <div id="settings-bar" class="hidden w-full max-w-4xl px-4 pb-3 flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-slate-300">
        <label class="flex items-center gap-2">Voice
            <select id="voice-select" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-white"></select>
        </label>
        <label class="flex items-center gap-2" title="Off if the robot keeps cutting itself off (speakers too loud for the mic)">
            <input id="barge-in" type="checkbox" class="accent-blue-500"> Let me interrupt it
        </label>
        <span class="text-xs text-slate-500">A new voice is used from the next conversation.</span>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 w-full max-w-4xl flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Avatar Section -->
        <section class="flex-1 flex flex-col items-center justify-center p-8 min-h-[40vh]">
            <div id="avatar" class="avatar-container w-80 h-80 relative drop-shadow-2xl z-10">
                <svg id="avatar-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="w-full h-full overflow-visible">
                    <defs>
                        <radialGradient id="aura-grad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="currentColor" stop-opacity="0.4" />
                            <stop offset="100%" stop-color="currentColor" stop-opacity="0" />
                        </radialGradient>
                        <linearGradient id="head-base" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#334155"/>
                            <stop offset="100%" stop-color="#0f172a"/>
                        </linearGradient>
                        <linearGradient id="visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#020617"/>
                            <stop offset="50%" stop-color="#0f172a"/>
                            <stop offset="100%" stop-color="#020617"/>
                        </linearGradient>
                        <linearGradient id="glass-glare" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                        </linearGradient>
                    </defs>

                    <!-- Background Aura -->
                    <circle class="aura text-blue-500" cx="200" cy="200" r="180" fill="url(#aura-grad)" />

                    <!-- Floating Rings (Neck/Base) -->
                    <ellipse cx="200" cy="320" rx="70" ry="20" fill="none" stroke="#334155" stroke-width="4" />
                    <ellipse cx="200" cy="335" rx="50" ry="15" fill="none" stroke="#475569" stroke-width="3" />

                    <!-- Main Head -->
                    <g id="robot-head">
                        <!-- Head Shell -->
                        <rect x="70" y="50" width="260" height="230" rx="90" fill="url(#head-base)" stroke="#475569" stroke-width="2"/>
                        
                        <!-- Ears/Side Nodes -->
                        <g class="ears">
                            <rect x="40" y="120" width="40" height="90" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
                            <rect x="320" y="120" width="40" height="90" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
                            <!-- Ear Cores -->
                            <rect id="ear-l" x="45" y="145" width="10" height="40" rx="5" fill="#38bdf8" />
                            <rect id="ear-r" x="345" y="145" width="10" height="40" rx="5" fill="#38bdf8" />
                        </g>

                        <!-- Visor Outer -->
                        <rect class="visor-glass" x="90" y="90" width="220" height="150" rx="50" fill="url(#visor-grad)" stroke="#1e293b" stroke-width="4" />
                        
                        <!-- Visor Glare -->
                        <path d="M 100 140 Q 200 90 300 140 L 300 100 Q 200 80 100 100 Z" fill="url(#glass-glare)"/>

                        <!-- Face Elements (Translate dynamically for 3D effect) -->
                        <g id="face-elements" class="eye-group">
                            <!-- LED brows (moved and tilted per expression) -->
                            <rect id="brow-l" class="led" x="123" y="100" width="44" height="6" rx="3" fill="#38bdf8" />
                            <rect id="brow-r" class="led" x="233" y="100" width="44" height="6" rx="3" fill="#38bdf8" />
                            <!-- Cheeks (blush) -->
                            <ellipse id="cheek-l" cx="122" cy="196" rx="15" ry="7" fill="#fb7185" opacity="0" />
                            <ellipse id="cheek-r" cx="278" cy="196" rx="15" ry="7" fill="#fb7185" opacity="0" />
                            <!-- Eyes Base -->
                            <g class="eyes-container">
                                <!-- Left Eye -->
                                <clipPath id="left-eye-clip">
                                    <rect x="120" y="110" width="50" height="60" rx="25" />
                                </clipPath>
                                <g class="eye">
                                    <rect x="120" y="110" width="50" height="60" rx="25" fill="#020617" stroke="#334155" stroke-width="3"/>
                                    <g clip-path="url(#left-eye-clip)">
                                        <!-- Group for parallax movement -->
                                        <g id="pupil-l-group">
                                            <circle class="iris-color led" cx="145" cy="140" r="16" fill="#38bdf8" />
                                            <circle cx="145" cy="140" r="8" fill="#020617" />
                                            <circle cx="150" cy="133" r="4" fill="#ffffff" opacity="0.9" />
                                        </g>
                                        <path id="lid-l-up" d="" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
                                        <path id="lid-l-low" d="" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
                                    </g>
                                </g>

                                <!-- Right Eye -->
                                <clipPath id="right-eye-clip">
                                    <rect x="230" y="110" width="50" height="60" rx="25" />
                                </clipPath>
                                <g class="eye">
                                    <rect x="230" y="110" width="50" height="60" rx="25" fill="#020617" stroke="#334155" stroke-width="3"/>
                                    <g clip-path="url(#right-eye-clip)">
                                        <!-- Group for parallax movement -->
                                        <g id="pupil-r-group">
                                            <circle class="iris-color led" cx="255" cy="140" r="16" fill="#38bdf8" />
                                            <circle cx="255" cy="140" r="8" fill="#020617" />
                                            <circle cx="260" cy="133" r="4" fill="#ffffff" opacity="0.9" />
                                        </g>
                                        <path id="lid-r-up" d="" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
                                        <path id="lid-r-low" d="" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
                                    </g>
                                </g>
                            </g>

                            <!-- Mouth -->
                            <path id="dynamic-mouth" class="led" d="M 150 190 C 175 192 225 192 250 190 C 225 202 175 202 150 190 Z" fill="#38bdf8" />
                            <path id="mouth-inner" d="" fill="#020617" />
                        </g>
                    </g>
                </svg>
            </div>
            
            <div class="mt-12 z-20">
                <button id="talk-btn" class="group relative inline-flex items-center justify-center px-8 py-4 font-bold text-white transition-all duration-200 bg-blue-600 font-pj rounded-xl hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)]">
                    <i id="talk-btn-icon" class="fa-solid fa-satellite-dish mr-3 text-xl group-hover:scale-110 transition-transform"></i>
                    <span id="talk-btn-text">Start conversation</span>
                </button>
            </div>
        </section>

        <!-- Chat Log Section -->
        <section class="flex-1 bg-slate-800/50 border-l border-slate-700/50 flex flex-col w-full h-[60vh] md:h-auto">
            <div id="chat-log" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Initial Greeting -->
                <div class="flex items-start">
                    <div class="bg-blue-600 text-white rounded-2xl rounded-tl-none px-5 py-3 max-w-[85%] shadow-md">
                        Hi! Press <b>Start conversation</b> and just talk to me, like a phone call. You can talk over me too.
                    </div>
                </div>
            </div>
            <form id="text-form" class="flex gap-2 p-3 border-t border-slate-700/50">
                <input id="text-input" autocomplete="off" placeholder="Or type a message…" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                <button type="submit" class="bg-slate-700 hover:bg-slate-600 text-white rounded-lg px-3" title="Send"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </section>

    </main>

    <!-- Error Toast Notification -->
    <div id="error-toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="error-message">An error occurred.</span>
    </div>

    <script type="module">
        const API_KEY = ""; // The Canvas environment automatically injects the key here

        // Gemini Live: one WebSocket for the whole conversation, voice in and voice out.
        const LIVE_MODEL = 'gemini-3.8-live';
        const LIVE_URL = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent';
        const IN_RATE = 16000;    // what the mic is sent at (16-bit PCM)
        const OUT_RATE = 24000;   // what the voice comes back at
        const VOICES = ['Zephyr', 'Puck', 'Charon', 'Kore', 'Fenrir', 'Aoede', 'Leda', 'Orus'];
        const EXPRESSIONS = ['neutral', 'happy', 'excited', 'laughing', 'surprised', 'curious', 'thinking', 'sad', 'concerned', 'embarrassed', 'annoyed'];
        const PERSONA = "You are Gemini, a friendly robot with an expressive face on a screen, chatting with the user by voice. " +
            "Keep it conversational, warm and snappy, like a fun friend on a phone call: usually one to three sentences. " +
            "Your face shows how you feel: call set_expression whenever your mood changes, just before you say the thing that changes it " +
            "(happy when pleased, laughing at something funny, surprised, curious, thinking while you work something out, sad or concerned at bad news, " +
            "embarrassed, annoyed, excited). Never mention the function or your expressions out loud.";

        const $ = (id) => document.getElementById(id);
        const avatar = $('avatar'), talkBtn = $('talk-btn'), talkBtnText = $('talk-btn-text'), talkBtnIcon = $('talk-btn-icon');
        const chatLog = $('chat-log'), statusIndicator = $('status-indicator'), statusText = $('status-text');
        const errorToast = $('error-toast'), errorMessage = $('error-message');
        const clamp01 = (v) => Math.min(1, Math.max(0, v));
        const lerp = (a, b, k) => a + (b - a) * k;

        // --- Settings kept in this browser ---
        const store = {
            get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
        };
        const keyForm = $('key-form'), keyInput = $('key-input'), settingsBar = $('settings-bar');
        const voiceSelect = $('voice-select'), bargeIn = $('barge-in');
        function getApiKey() { return API_KEY || store.get('geminiApiKey', ''); }
        function showKeyForm() { keyForm.classList.remove('hidden'); keyInput.focus(); }
        keyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const key = keyInput.value.trim();
            if (!key) return;
            store.set('geminiApiKey', key);
            keyInput.value = '';
            keyForm.classList.add('hidden');
        });
        $('key-btn').addEventListener('click', () => keyForm.classList.toggle('hidden'));
        $('settings-btn').addEventListener('click', () => settingsBar.classList.toggle('hidden'));
        for (const v of VOICES) voiceSelect.add(new Option(v, v));
        voiceSelect.value = store.get('buddyVoice', 'Zephyr');
        voiceSelect.addEventListener('change', () => store.set('buddyVoice', voiceSelect.value));
        bargeIn.checked = store.get('buddyBargeIn', '1') === '1';
        bargeIn.addEventListener('change', () => store.set('buddyBargeIn', bargeIn.checked ? '1' : '0'));
        if (!getApiKey()) showKeyForm();

        window.addEventListener('error', (e) => showError('Error: ' + e.message));
        window.addEventListener('unhandledrejection', (e) => showError('Error: ' + (e.reason?.message || e.reason || 'unknown')));

        // --- The conversation ---------------------------------------------------------------
        // talk: null when no conversation; else { ws, mic, ... } for the one in progress
        let talk = null;
        let resumeHandle = null;      // lets a dropped or time-limited session carry on where it was
        let typedTurn = false;        // a typed message is waiting for its reply
        let toolMode = 0;             // 0: expression tool, non-blocking; 1: plain tool; 2: no tool (the server refused them)

        talkBtn.addEventListener('click', () => { talk ? endConversation() : startConversation(); });

        async function startConversation() {
            if (!getApiKey()) { showKeyForm(); return showError('Enter your Gemini API key first.'); }
            talkBtn.disabled = true;
            setState('connecting');
            try {
                initAudioOut();
                const mic = await startMic();
                talk = { mic, ws: null, ended: false, tries: 0 };
                resumeHandle = null;
                openSocket();
            } catch (err) {
                showError(err.name === 'NotAllowedError' ? 'The page needs your microphone.' : 'Microphone: ' + err.message);
                endConversation();
            } finally {
                talkBtn.disabled = false;
            }
        }

        function endConversation() {
            if (talk) {
                talk.ended = true;
                try { talk.ws?.close(1000); } catch (e) {}
                talk.mic?.stop();
            }
            talk = null;
            stopPlayback();
            closeBubbles();
            setState('off');
        }

        function setupMessage() {
            const setup = {
                model: `models/${LIVE_MODEL}`,
                generationConfig: {
                    responseModalities: ['AUDIO'],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceSelect.value } } },
                },
                systemInstruction: { parts: [{ text: toolMode < 2 ? PERSONA : PERSONA.replace(/ Your face shows.*$/, '') }] },
                inputAudioTranscription: {},
                outputAudioTranscription: {},
                realtimeInputConfig: { automaticActivityDetection: { silenceDurationMs: 600 } },
                contextWindowCompression: { slidingWindow: {} },
                sessionResumption: resumeHandle ? { handle: resumeHandle } : {},
            };
            if (toolMode < 2) {
                const fn = {
                    name: 'set_expression',
                    description: 'Changes the expression on your robot face. Call it whenever your mood changes.',
                    parameters: {
                        type: 'OBJECT',
                        properties: {
                            expression: { type: 'STRING', enum: EXPRESSIONS },
                            intensity: { type: 'NUMBER', description: '0.3 (slight) to 1 (strong); 0.8 if unsure' },
                        },
                        required: ['expression'],
                    },
                };
                if (toolMode === 0) fn.behavior = 'NON_BLOCKING';   // the voice carries on while the face changes
                setup.tools = [{ functionDeclarations: [fn] }];
            }
            return { setup };
        }

        function openSocket() {
            const t = talk;
            const ws = new WebSocket(`${LIVE_URL}?key=${encodeURIComponent(getApiKey())}`);
            t.ws = ws;
            t.ready = false;
            ws.onopen = () => ws.send(JSON.stringify(setupMessage()));
            ws.onmessage = async (ev) => {
                const text = typeof ev.data === 'string' ? ev.data : await ev.data.text();
                let msg;
                try { msg = JSON.parse(text); } catch (e) { return; }
                if (talk === t && t.ws === ws) onServerMessage(msg);
            };
            ws.onclose = (ev) => {
                if (talk !== t || t.ws !== ws || t.ended) return;
                const why = ev.reason || `connection closed (${ev.code})`;
                if (!t.ready) {
                    // Refused at setup: a bad key ends it; otherwise try again with less (the tool first)
                    if (/api key|permission|unauthori[sz]ed|forbidden/i.test(why)) {
                        showKeyForm(); showError('Gemini: ' + why); return endConversation();
                    }
                    if (toolMode < 2 && t.tries < 2) { toolMode++; t.tries++; return openSocket(); }
                    showError('Gemini: ' + why); return endConversation();
                }
                // Dropped mid-conversation (or the server's time limit): carry on where it was
                if (resumeHandle && (t.drops = (t.drops || 0) + 1) <= 3) {
                    setState('connecting');
                    return setTimeout(() => { if (talk === t && !t.ended) openSocket(); }, 300);
                }
                showError('Gemini: ' + why);
                endConversation();
            };
        }

        function send(obj) {
            const ws = talk?.ws;
            if (ws && ws.readyState === WebSocket.OPEN && talk.ready) ws.send(JSON.stringify(obj));
        }

        function onServerMessage(msg) {
            if (msg.setupComplete) {
                talk.ready = true;
                talk.drops = 0;
                setState('live');
                return;
            }
            if (msg.sessionResumptionUpdate?.resumable && msg.sessionResumptionUpdate.newHandle) {
                resumeHandle = msg.sessionResumptionUpdate.newHandle;
            }
            if (msg.goAway) {
                // The session is about to end (time limit): reconnect now, with the handle, so there's no gap
                if (resumeHandle) { const old = talk.ws; openSocket(); setTimeout(() => { try { old.close(1000); } catch (e) {} }, 2000); }
            }
            if (msg.toolCall?.functionCalls) {
                const responses = [];
                for (const call of msg.toolCall.functionCalls) {
                    if (call.name === 'set_expression') {
                        setExpression(call.args?.expression, call.args?.intensity, 'model');
                        responses.push({ id: call.id, name: call.name, response: { result: 'ok', scheduling: 'SILENT' } });
                    } else {
                        responses.push({ id: call.id, name: call.name, response: { error: 'unknown function' } });
                    }
                }
                send({ toolResponse: { functionResponses: responses } });
            }
            const sc = msg.serverContent;
            if (!sc) return;
            if (sc.interrupted) {
                stopPlayback();
                closeModelBubble(true);
            }
            if (sc.inputTranscription?.text && !typedTurn) {      // (a typed message is already in the log)
                addToBubble('user', sc.inputTranscription.text);
                life.awaiting = performance.now();
            }
            for (const part of sc.modelTurn?.parts || []) {
                if (part.inlineData?.data && /audio/.test(part.inlineData.mimeType || 'audio')) {
                    closeUserBubble();
                    typedTurn = false;
                    playChunk(part.inlineData.data);
                }
            }
            if (sc.outputTranscription?.text) {
                closeUserBubble();
                addToBubble('model', sc.outputTranscription.text);
                expressionFromWords(sc.outputTranscription.text);
            }
            if (sc.turnComplete) {
                closeModelBubble(false);
                life.awaiting = 0;
                life.turnEnded = performance.now();
            }
        }

        // Typed messages go into the same conversation (one is started if needed)
        $('text-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = $('text-input');
            const text = input.value.trim();
            if (!text) return;
            if (!talk) {
                await startConversation();
                for (let i = 0; i < 100 && talk && !talk.ready; i++) await new Promise(r => setTimeout(r, 100));
            }
            if (!talk?.ready) return;
            input.value = '';
            closeBubbles();
            addToBubble('user', text);
            closeUserBubble();
            stopPlayback();
            typedTurn = true;
            send({ realtimeInput: { text } });
            life.awaiting = performance.now();
        });

        // --- The microphone: 16 kHz 16-bit PCM, in ~32 ms pieces --------------------------
        const MIC_WORKLET = `
            class Mic extends AudioWorkletProcessor {
                constructor() { super(); this.ratio = sampleRate / ${IN_RATE}; this.acc = 0; this.n = 0; this.pos = 0;
                                this.out = new Int16Array(512); this.k = 0; this.sq = 0; }
                process(inputs) {
                    const x = inputs[0][0];
                    if (!x) return true;
                    for (let i = 0; i < x.length; i++) {
                        this.acc += x[i]; this.n++; this.pos++;
                        if (this.pos >= this.ratio) {           // average each output sample's stretch (a simple low-pass)
                            this.pos -= this.ratio;
                            const v = Math.max(-1, Math.min(1, this.acc / this.n));
                            this.acc = 0; this.n = 0;
                            this.out[this.k++] = v * 32767; this.sq += v * v;
                            if (this.k === this.out.length) {
                                this.port.postMessage({ pcm: this.out.buffer, rms: Math.sqrt(this.sq / this.k) }, [this.out.buffer]);
                                this.out = new Int16Array(512); this.k = 0; this.sq = 0;
                            }
                        }
                    }
                    return true;
                }
            }
            registerProcessor('mic', Mic);`;

        async function startMic() {
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
            });
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([MIC_WORKLET], { type: 'application/javascript' })));
            const src = ctx.createMediaStreamSource(stream);
            const node = new AudioWorkletNode(ctx, 'mic');
            src.connect(node);
            node.port.onmessage = (e) => {
                life.micLevel = e.data.rms;
                // Without "let me interrupt", the mic is muted while the robot talks (for loud speakers)
                const pcm = (!bargeIn.checked && isSpeaking()) ? new ArrayBuffer(e.data.pcm.byteLength) : e.data.pcm;
                send({ realtimeInput: { audio: { mimeType: `audio/pcm;rate=${IN_RATE}`, data: toBase64(pcm) } } });
            };
            return { stop() { stream.getTracks().forEach(t => t.stop()); node.disconnect(); ctx.close(); } };
        }

        function toBase64(buf) {
            const bytes = new Uint8Array(buf);
            let s = '';
            for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            return btoa(s);
        }

        // --- The robot's voice: chunks played back to back as they arrive -----------------
        // Played through an <audio> element (not straight from Web Audio) so the browser's echo
        // cancellation hears it and keeps it out of the mic: otherwise the robot interrupts itself.
        let outCtx = null, outNode = null, outEl = null;
        let nextPlay = 0;              // outCtx time the next chunk starts
        let sources = [];              // scheduled chunks, stopped if the user talks over the robot
        const OUT_DELAY = 0.05;        // the <audio> element's own small delay, for the lip sync

        function initAudioOut() {
            if (!outCtx) {
                outCtx = new (window.AudioContext || window.webkitAudioContext)();
                outNode = outCtx.createGain();
                const dest = outCtx.createMediaStreamDestination();
                outNode.connect(dest);
                outEl = new Audio();
                outEl.srcObject = dest.stream;
            }
            if (outCtx.state === 'suspended') outCtx.resume();
            outEl.play().catch(() => {});
        }

        function playChunk(b64) {
            const bin = atob(b64);
            const n = bin.length >> 1;
            const buf = outCtx.createBuffer(1, n, OUT_RATE);
            const ch = buf.getChannelData(0);
            for (let i = 0; i < n; i++) {
                let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
                if (v >= 32768) v -= 65536;
                ch[i] = v / 32768;
            }
            const start = Math.max(outCtx.currentTime + 0.06, nextPlay);
            lip.add(ch, start, start !== nextPlay);
            const src = outCtx.createBufferSource();
            src.buffer = buf;
            src.connect(outNode);
            src.start(start);
            src.onended = () => { sources = sources.filter(s => s !== src); };
            sources.push(src);
            nextPlay = start + buf.duration;
            life.awaiting = 0;
        }

        function stopPlayback() {
            for (const s of sources) { try { s.stop(); } catch (e) {} }
            sources = [];
            nextPlay = 0;
            lip.clear();
        }

        const isSpeaking = () => !!outCtx && outCtx.currentTime < nextPlay;
        const heardTime = () => outCtx.currentTime - (outCtx.outputLatency || outCtx.baseLatency || 0) - OUT_DELAY;

        // --- Lip sync, worked out as the voice streams in ----------------------------------
        // Loudness drives the jaw; where the energy sits (low for "oo"/"oh", high for "ee"/"s")
        // sets how wide or round the lips are. Judged against the voice's own recent levels.
        const lip = (() => {
            const FPS = 100, HOP = OUT_RATE / FPS, LEAD = 0.04;
            const pole = (hz) => Math.exp(-2 * Math.PI * hz / OUT_RATE);
            const a900 = pole(900), a1500 = pole(1500), a3000 = pole(3000);
            let frames = [];               // { t, open, wide, round }
            let lp900 = 0, lp1500 = 0, lp3000 = 0, open = 0, wide = 0, round = 0;
            let carry = [], carryT = 0;    // samples left over from the last chunk, and when they play
            const hist = { rms: [], low: [], bright: [] };   // recent frames, for the running levels
            let ref = 0.08, lowMid = 0.5, lowTop = 0.7, brightMid = 0.1, brightTop = 0.25;
            const pct = (arr, p) => { const a = arr.slice().sort((x, y) => x - y); return a[Math.floor((a.length - 1) * p)] || 0; };
            const keep = (arr, v) => { arr.push(v); if (arr.length > 600) arr.shift(); };

            function add(samples, start, gap) {
                let x = samples, t0 = start;
                if (!gap && carry.length) { x = Float32Array.from([...carry, ...samples]); t0 = carryT; }
                const nFrames = Math.floor(x.length / HOP);
                const feats = [];
                for (let f = 0; f < nFrames; f++) {
                    let e = 0, eLow = 0, eBright = 0, eHiss = 0;
                    for (let i = f * HOP; i < (f + 1) * HOP; i++) {
                        const v = x[i];
                        lp900 = v + a900 * (lp900 - v); lp1500 = v + a1500 * (lp1500 - v); lp3000 = v + a3000 * (lp3000 - v);
                        e += v * v; eLow += lp900 * lp900;
                        eBright += (v - lp1500) * (v - lp1500); eHiss += (v - lp3000) * (v - lp3000);
                    }
                    const rms = Math.sqrt(e / HOP);
                    feats.push({ rms, low: eLow / (e + 1e-12), bright: eBright / (e + 1e-12), hiss: eHiss / (e + 1e-12) });
                    keep(hist.rms, rms);
                }
                carry = Array.from(x.subarray(nFrames * HOP));
                carryT = t0 + nFrames * HOP / OUT_RATE;
                // Running levels: the voice's loud frames open the mouth fully
                if (hist.rms.length > 40) ref = Math.max(pct(hist.rms, 0.9), 0.01);
                for (const ft of feats) if (ft.rms > ref * 0.3) { keep(hist.low, ft.low); keep(hist.bright, ft.bright); }
                if (hist.low.length > 30) {
                    lowMid = pct(hist.low, 0.5); lowTop = pct(hist.low, 0.9);
                    brightMid = pct(hist.bright, 0.5); brightTop = pct(hist.bright, 0.9);
                }
                feats.forEach((ft, f) => {
                    const loud = ft.rms / ref;
                    let o = Math.pow(clamp01((loud - 0.1) / 0.8), 0.75), w = 0, r = 0;
                    if (loud > 0.1) {
                        w = clamp01((ft.bright - brightMid) / (brightTop - brightMid + 1e-6));
                        r = clamp01((ft.low - lowMid) / (lowTop - lowMid + 1e-6)) * (1 - w);
                        if (ft.hiss > 0.3) { o *= 0.45; w = 1; }   // hissy sounds go through nearly closed teeth
                    }
                    open += (o - open) * (o > open ? 0.6 : 0.4);
                    wide += (w - wide) * 0.3;
                    round += (r - round) * 0.3;
                    frames.push({ t: t0 + f / FPS, open, wide, round, loud: clamp01(loud) });
                });
            }
            function at(t) {
                t += LEAD;
                while (frames.length > 1 && frames[1].t <= t) frames.shift();
                const f = frames[0];
                return f && f.t <= t && t - f.t < 0.05 ? f : null;
            }
            function clear() { frames = []; carry = []; open = wide = round = 0; }
            return { add, at, clear };
        })();

        // --- Chat log: live transcripts of both sides --------------------------------------
        const bubbles = { user: null, model: null };
        function addToBubble(who, text) {
            if (!bubbles[who]) {
                const row = document.createElement('div');
                row.className = 'flex w-full ' + (who === 'user' ? 'justify-end' : 'justify-start');
                const b = document.createElement('div');
                b.className = 'px-5 py-3 max-w-[85%] shadow-md text-white rounded-2xl ' +
                    (who === 'user' ? 'bg-slate-700 rounded-tr-none' : 'bg-blue-600 rounded-tl-none');
                row.appendChild(b);
                chatLog.appendChild(row);
                bubbles[who] = b;
            }
            bubbles[who].textContent += text;
            chatLog.scrollTo({ top: chatLog.scrollHeight, behavior: 'smooth' });
        }
        function closeUserBubble() { bubbles.user = null; }
        function closeModelBubble(cut) {
            if (cut && bubbles.model) bubbles.model.textContent = bubbles.model.textContent.trimEnd() + ' …';
            bubbles.model = null;
        }
        function closeBubbles() { closeUserBubble(); closeModelBubble(false); }

        // --- State shown in the header, the button and the visor ---------------------------
        let state = 'off';
        function setState(s) {
            state = s;
            if (s === 'off') {
                talkBtnText.innerText = 'Start conversation';
                talkBtnIcon.className = 'fa-solid fa-microphone mr-3 text-xl group-hover:scale-110 transition-transform';
                talkBtn.classList.remove('bg-rose-600', 'hover:bg-rose-500');
                talkBtn.classList.add('bg-blue-600', 'hover:bg-blue-500');
            } else {
                talkBtnText.innerText = s === 'connecting' ? 'Connecting…' : 'End conversation';
                talkBtnIcon.className = 'fa-solid fa-phone-slash mr-3 text-xl';
                talkBtn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
                talkBtn.classList.add('bg-rose-600', 'hover:bg-rose-500');
            }
        }
        let shownMood = '';
        function showMood(mood) {          // called every frame; touches the page only when it changes
            if (mood === shownMood) return;
            shownMood = mood;
            const [dot, label, cls] = {
                off: ['status-idle', 'Ready', ''], connecting: ['status-idle', 'Connecting…', 'thinking'],
                listening: ['status-listening', 'Listening', 'listening'], hearing: ['status-listening', 'Hearing you', 'listening'],
                thinking: ['status-thinking', 'Thinking…', 'thinking'], speaking: ['status-speaking', 'Speaking', 'speaking'],
            }[mood];
            statusIndicator.className = 'status-dot ' + dot;
            statusText.innerText = label;
            avatar.classList.remove('listening', 'thinking', 'speaking');
            if (cls) avatar.classList.add(cls);
        }

        let errorTimer = null;
        function showError(msg) {
            errorMessage.innerText = msg;
            errorToast.classList.remove('opacity-0', 'pointer-events-none');
            clearTimeout(errorTimer);
            errorTimer = setTimeout(() => errorToast.classList.add('opacity-0', 'pointer-events-none'), 6000);
        }

        // --- Expressions --------------------------------------------------------------------
        // Each sets targets for the face; intensity scales how far from neutral it goes.
        // brow: lift (px, + up), tilt (deg, + inner ends down = cross), asym (px, the left brow higher)
        // lidUp: upper lids closing 0..1; lidTilt: + inner corners down (cross), - inner up (sad)
        // lidLow: lower lids rising 0..1 (a smile in the eyes); pupil: size; smile: mouth corners -1..1
        // cheek: blush 0..1; color: the LEDs; tilt: head (deg)
        const EXPR = {
            neutral:     { color: '#38bdf8' },
            happy:       { brow: [2, 0, 0], lidLow: 0.35, smile: 0.8, cheek: 0.25, color: '#fbbf24' },
            excited:     { brow: [5, 0, 0], lidLow: 0.15, smile: 1, pupil: 1.15, cheek: 0.3, color: '#f472b6' },
            laughing:    { brow: [3, 0, 0], lidUp: 0.08, lidLow: 0.42, smile: 1, cheek: 0.45, color: '#fbbf24', laugh: 1 },
            surprised:   { brow: [7, 0, 0], pupil: 0.8, smile: 0, oh: 0.5, color: '#e0f2fe' },
            curious:     { brow: [1, 0, 5], pupil: 1.1, smile: 0.15, color: '#22d3ee', tilt: 7 },
            thinking:    { brow: [0, 0, 4], lidUp: 0.32, smile: 0, color: '#a78bfa', tilt: -4 },
            sad:         { brow: [1, -12, 0], lidUp: 0.42, lidTilt: -0.25, smile: -0.7, pupil: 1.1, color: '#60a5fa', tilt: -3, droop: 1 },
            concerned:   { brow: [1, -8, 0], lidUp: 0.25, lidTilt: -0.15, smile: -0.3, color: '#a5b4fc' },
            embarrassed: { brow: [0, -4, 0], lidUp: 0.4, smile: 0.3, cheek: 0.85, color: '#fb7185', away: 1 },
            annoyed:     { brow: [-3, 12, 0], lidUp: 0.45, lidTilt: 0.3, smile: -0.4, color: '#f87171' },
        };
        const NEUTRAL = { brow: [0, 0, 0], lidUp: 0, lidTilt: 0, lidLow: 0, pupil: 1, smile: 0.12, cheek: 0, oh: 0, tilt: 0, laugh: 0, droop: 0, away: 0 };
        function exprTargets(name, k) {
            const e = EXPR[name] || EXPR.neutral, out = {};
            for (const key in NEUTRAL) {
                const n = NEUTRAL[key], v = e[key] ?? n;
                out[key] = Array.isArray(n) ? n.map((x, i) => lerp(x, v[i], k)) : lerp(n, v, k);
            }
            out.color = mixColor(EXPR.neutral.color, e.color, k);
            return out;
        }
        let expr = { name: 'neutral', k: 1, until: 0, from: '' };
        function setExpression(name, intensity, from) {
            if (!EXPR[name]) return;
            const k = Math.min(1, Math.max(0.3, Number(intensity) || 0.8));
            expr = { name, k, from, until: performance.now() + (from === 'model' ? 9000 : 3500) };
        }
        // When the model doesn't set its face, take a cue from what it says
        function expressionFromWords(text) {
            const now = performance.now();
            if (expr.from === 'model' && now < expr.until) return;
            const t = text.toLowerCase();
            const cue = /\b(ha(ha)+|hehe|lol)\b|😂|🤣/.test(t) ? 'laughing'
                : /\b(wow|whoa|no way|really\?|seriously)\b/.test(t) ? 'surprised'
                : /\b(sorry|unfortunately|sad|oh no|that's tough|that's hard)\b/.test(t) ? 'concerned'
                : /\b(great|awesome|love|glad|nice|fun|amazing|brilliant)\b/.test(t) ? 'happy'
                : /\b(hmm+|let me think|i wonder)\b/.test(t) ? 'thinking'
                : /!/.test(t) ? 'excited'
                : /\?/.test(t) ? 'curious' : null;
            if (cue) setExpression(cue, 0.6, 'words');
        }

        function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
        function mixColor(a, b, k) {
            const x = hexRgb(a), y = hexRgb(b);
            return '#' + x.map((v, i) => Math.round(lerp(v, y[i], k)).toString(16).padStart(2, '0')).join('');
        }

        // --- The living face: blinks, gaze, head movement, listening, all every frame -------
        const life = {
            micLevel: 0, noise: 0.004, userTalking: false, talkSince: 0, quietSince: 0,
            awaiting: 0, turnEnded: 0,
            nextBlink: 0, blinkT: -1, double: false,
            gaze: [0, 0], gazeTarget: [0, 0], nextSaccade: 0,
            mouse: [0, 0], mouseAt: -1e9,
            head: [0, 0, 0], env: 0, envSlow: 0, nod: 0, nodT: -1,
            face: null,                 // the current (smoothed) expression values
        };
        document.addEventListener('mousemove', (e) => {
            const r = $('avatar-svg').getBoundingClientRect();
            life.mouse = [
                Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2))),
                Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (window.innerHeight / 2))),
            ];
            life.mouseAt = performance.now();
        });

        const el = {
            svg: $('avatar-svg'), face: $('face-elements'), pupilL: $('pupil-l-group'), pupilR: $('pupil-r-group'),
            browL: $('brow-l'), browR: $('brow-r'), cheekL: $('cheek-l'), cheekR: $('cheek-r'),
            lidLU: $('lid-l-up'), lidLL: $('lid-l-low'), lidRU: $('lid-r-up'), lidRL: $('lid-r-low'),
            earL: $('ear-l'), earR: $('ear-r'), mouth: $('dynamic-mouth'), inner: $('mouth-inner'),
            leds: Array.from(document.querySelectorAll('.led')),
        };

        // Eyelids: an upper lid closing down to `close` (0..1) with its inner end tilted,
        // and a lower lid rising with an upward arch (the "smiling eyes")
        const EYE = { l: { x0: 120, x1: 170, y0: 110, y1: 170, inner: 1 }, r: { x0: 230, x1: 280, y0: 110, y1: 170, inner: -1 } };
        function lidPaths(e, close, tilt, low) {
            const h = e.y1 - e.y0, yc = e.y0 + h * close;
            const dIn = tilt * h * 0.5, yInner = yc + dIn, yOuter = yc - dIn * 0.4;
            const xi = e.inner > 0 ? e.x1 + 4 : e.x0 - 4, xo = e.inner > 0 ? e.x0 - 4 : e.x1 + 4;
            const up = close <= 0.001 && Math.abs(tilt) < 0.01 ? ''
                : `M ${xo} ${e.y0 - 6} L ${xi} ${e.y0 - 6} L ${xi} ${Math.max(e.y0 - 6, yInner)} L ${xo} ${Math.max(e.y0 - 6, yOuter)} Z`;
            const yb = e.y1 - h * low, arch = h * low * 0.6;
            const lowP = low <= 0.01 ? ''
                : `M ${e.x0 - 4} ${e.y1 + 6} L ${e.x0 - 4} ${yb} Q ${(e.x0 + e.x1) / 2} ${yb - arch} ${e.x1 + 4} ${yb} L ${e.x1 + 4} ${e.y1 + 6} Z`;
            return [up, lowP];
        }

        // The mouth: a lens between two corners, the corners lifted for a smile
        function mouthPath(cx, cy, hw, up, down, c, lift) {
            const yt = cy - up * 4 / 3, yb = cy + down * 4 / 3, yc = cy - lift;
            const l = cx - hw, r = cx + hw, dx = hw * c;
            return `M ${l} ${yc} C ${cx - dx} ${yt} ${cx + dx} ${yt} ${r} ${yc} C ${cx + dx} ${yb} ${cx - dx} ${yb} ${l} ${yc} Z`;
        }
        function drawMouth({ open, wide, round }, smile, oh) {
            round = Math.max(round, oh * (1 - open));          // surprised: an "o" even when quiet
            const cx = 200, cy = 191;
            const hw = 50 + wide * 14 - round * 22 - Math.abs(smile) * 4;
            const up = 2 + open * 13 + round * 7 + Math.max(0, -smile) * 3;
            const down = 6 + open * 26 + round * 7 + Math.max(0, smile) * 4;
            const c = 0.55 + round * 0.4;
            const lift = smile * 9 * (1 - round * 0.8);
            el.mouth.setAttribute('d', mouthPath(cx, cy, hw, up, down, c, lift));
            const part = clamp01((open + round * 0.3 - 0.08) / 0.25);
            el.inner.setAttribute('d', part > 0
                ? mouthPath(cx, cy, Math.max(0, hw - 11), Math.max(0, up - 6) * part, Math.max(0, down - 10) * part, Math.min(0.95, c + 0.15), lift * 0.8)
                : '');
        }

        let mouth = { open: 0, wide: 0, round: 0 };
        let last = performance.now();
        function frame(now = performance.now()) {
            requestAnimationFrame(frame);
            const dt = Math.min(0.1, Math.max(0.001, (now - last) / 1000));
            last = now;
            const ease = (tau) => 1 - Math.exp(-dt / tau);

            // What's going on
            const speaking = isSpeaking();
            const m = life.micLevel;
            if (!life.userTalking) life.noise = lerp(life.noise, m, m < life.noise ? 0.05 : 0.002);   // the room's own level
            const loudEnough = m > Math.max(0.012, life.noise * 3);
            if (loudEnough && !speaking) {
                if (!life.userTalking) { life.talkSince = now; expr.until = 0; expr.from = ''; typedTurn = false; }   // their turn: the robot's last face goes
                life.userTalking = true; life.quietSince = 0;
            } else if (life.userTalking) {
                if (!life.quietSince) life.quietSince = now;
                if (now - life.quietSince > 350) {
                    life.userTalking = false;
                    if (now - life.talkSince > 600) {
                        life.awaiting = now;                                          // they've stopped: a reply is coming
                        if (Math.random() < 0.6) { life.nodT = now; }                 // a little nod, "mm-hm"
                    }
                }
            }
            if (life.awaiting && now - life.awaiting > 8000) life.awaiting = 0;
            const mood = state === 'off' ? 'off' : state === 'connecting' ? 'connecting'
                : speaking ? 'speaking' : life.userTalking ? 'hearing' : life.awaiting ? 'thinking' : 'listening';
            showMood(mood);

            // The expression: the model's (or the words'), then the mood's own, then neutral
            let name = 'neutral', k = 1;
            if (now < expr.until || (expr.from === 'model' && speaking)) { name = expr.name; k = expr.k; }
            else if (mood === 'thinking') { name = 'thinking'; k = 0.7; }
            else if (mood === 'hearing' || mood === 'listening') { name = 'curious'; k = 0.25; }
            const target = exprTargets(name, k);
            if (!life.face) life.face = target;
            const f = life.face, ke = ease(0.18);
            for (const key in NEUTRAL) {
                f[key] = Array.isArray(f[key]) ? f[key].map((v, i) => lerp(v, target[key][i], ke)) : lerp(f[key], target[key], ke);
            }
            f.color = mixColor(f.color, target.color, ease(0.25));

            // Gaze: follow the mouse while it moves; otherwise look about now and then, at the user while
            // they talk, up and to the side while thinking, down and away when embarrassed
            if (now > life.nextSaccade) {
                let g;
                if (now - life.mouseAt < 2500) g = life.mouse;
                else if (mood === 'thinking' || name === 'thinking') g = [Math.random() < 0.5 ? -0.7 : 0.7, -0.6 + Math.random() * 0.2];
                else if (f.away > 0.5) g = [0.6, 0.6];
                else if (mood === 'hearing') g = [(Math.random() - 0.5) * 0.15, (Math.random() - 0.5) * 0.1];
                else g = [(Math.random() - 0.5) * 0.7, (Math.random() - 0.5) * 0.4];
                life.gazeTarget = g;
                const hold = now - life.mouseAt < 2500 ? 60 : mood === 'hearing' ? 900 + Math.random() * 1500
                    : mood === 'thinking' ? 900 + Math.random() * 700 : 700 + Math.random() * 2600;
                if (Math.hypot(g[0] - life.gaze[0], g[1] - life.gaze[1]) > 0.6 && Math.random() < 0.35) life.nextBlink = now;   // big glances often come with a blink
                life.nextSaccade = now + hold;
            }
            const kg = ease(now - life.mouseAt < 2500 ? 0.08 : 0.035);               // saccades: quick
            life.gaze = [lerp(life.gaze[0], life.gazeTarget[0], kg), lerp(life.gaze[1], life.gazeTarget[1], kg)];

            // Blinks: every 2-6 s, now and then a double; 140 ms each
            if (life.blinkT < 0 && now >= life.nextBlink) { life.blinkT = now; life.double = Math.random() < 0.15; }
            let blink = 0;
            if (life.blinkT >= 0) {
                const t = (now - life.blinkT) / 140;
                blink = t < 1 ? Math.sin(Math.PI * t) : 0;
                if (t >= 1) {
                    if (life.double) { life.double = false; life.blinkT = now + 60; }
                    else { life.blinkT = -1; life.nextBlink = now + 2000 + Math.random() * 4000; }
                }
            }

            // The voice: the mouth, and the head moving with the speech's emphasis
            const lf = speaking ? lip.at(heardTime()) : null;
            const tm = lf || { open: 0, wide: 0, round: 0, loud: 0 };
            const km = ease(0.025);
            for (const key in mouth) mouth[key] = lerp(mouth[key], tm[key], km);
            life.env = lerp(life.env, tm.loud || 0, ease(0.05));
            life.envSlow = lerp(life.envSlow, tm.loud || 0, ease(0.6));
            const emphasis = Math.max(0, life.env - life.envSlow);

            let nod = 0;
            if (life.nodT >= 0) {
                const t = (now - life.nodT) / 450;
                nod = t < 1 ? Math.sin(Math.PI * t) : 0;
                if (t >= 1) life.nodT = -1;
            }
            const s = now / 1000;
            const laugh = f.laugh * (speaking ? 1 : 0.3) * Math.sin(s * 22) * 1.5;
            const head = [
                -life.gaze[1] * 6 + Math.sin(s * 0.7) * 1.2 - emphasis * 10 - nod * 5 - f.droop * 4 + laugh,   // pitch (rotateX)
                life.gaze[0] * 9 + Math.sin(s * 0.45 + 1) * 1.5,                                             // yaw (rotateY)
                f.tilt + Math.sin(s * 0.33 + 2) * 1.2,                                                       // roll
            ];
            life.head = life.head.map((v, i) => lerp(v, head[i], ease(0.12)));

            // Draw
            el.svg.style.transform = `perspective(1000px) rotateX(${life.head[0].toFixed(2)}deg) rotateY(${life.head[1].toFixed(2)}deg) rotateZ(${life.head[2].toFixed(2)}deg)`;
            el.face.style.transform = `translate(${(life.gaze[0] * 15).toFixed(2)}px, ${(life.gaze[1] * 7.5).toFixed(2)}px)`;
            const pupil = `translate(${(life.gaze[0] * 7).toFixed(2)}px, ${(life.gaze[1] * 7).toFixed(2)}px)`;
            for (const [p, cx] of [[el.pupilL, 145], [el.pupilR, 255]]) {
                p.style.transformOrigin = `${cx}px 140px`;
                p.style.transform = `${pupil} scale(${f.pupil.toFixed(3)})`;
            }
            const close = Math.max(f.lidUp, blink), low = f.lidLow * (1 - blink * 0.5);
            const [lu, ll] = lidPaths(EYE.l, close, f.lidTilt, low), [ru, rl] = lidPaths(EYE.r, close, f.lidTilt, low);
            el.lidLU.setAttribute('d', lu); el.lidLL.setAttribute('d', ll);
            el.lidRU.setAttribute('d', ru); el.lidRL.setAttribute('d', rl);
            const [lift, tilt, asym] = f.brow;
            const browY = -lift + blink * 2 - emphasis * 4;
            el.browL.setAttribute('transform', `translate(0 ${(browY - asym).toFixed(2)}) rotate(${tilt.toFixed(2)} 145 103)`);
            el.browR.setAttribute('transform', `translate(0 ${browY.toFixed(2)}) rotate(${(-tilt).toFixed(2)} 255 103)`);
            el.cheekL.setAttribute('opacity', (f.cheek * 0.75).toFixed(3));
            el.cheekR.setAttribute('opacity', (f.cheek * 0.75).toFixed(3));
            for (const led of el.leds) led.setAttribute('fill', f.color);
            // The ear lights glow with the user's voice (listening) and the robot's own (speaking)
            const glow = clamp01(speaking ? 0.35 + life.env * 0.8 : life.userTalking ? 0.4 + m * 12 : 0.35);
            for (const ear of [el.earL, el.earR]) { ear.setAttribute('opacity', glow.toFixed(3)); ear.setAttribute('fill', f.color); }
            drawMouth(mouth, f.smile, f.oh);
        }

        frame();
        setState('off');
    </script>
</body>
</html>
