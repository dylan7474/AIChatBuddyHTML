<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive AI Buddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Advanced Avatar Animations --- */
        @keyframes float-complex {
            0% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-12px) rotate(1deg); }
            66% { transform: translateY(-5px) rotate(-1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .avatar-container {
            animation: float-complex 8s ease-in-out infinite;
            perspective: 1000px;
        }

        /* Aura & Glows */
        @keyframes pulse-aura {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
            100% { transform: scale(1); opacity: 0.3; }
        }
        .aura {
            transform-origin: center;
            animation: pulse-aura 4s ease-in-out infinite;
            transition: fill 0.4s ease;
        }

        /* Dynamic Mouth Transition */
        #dynamic-mouth {
            transition: d 0.08s ease-out, fill 0.3s ease;
        }

        /* Visor Styles */
        .visor-glass {
            transition: all 0.4s ease;
        }

        /* State: Listening */
        .listening .aura { fill: #10b981; animation-duration: 2s; }
        .listening .visor-glass { stroke: #10b981; stroke-width: 3px; filter: drop-shadow(0 0 15px rgba(16,185,129,0.5)); }
        .listening .iris-color { fill: #10b981; transition: fill 0.3s ease; }
        .listening #dynamic-mouth { fill: #10b981; }
        
        /* State: Thinking */
        @keyframes look-around {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }
        .thinking .eye-group { animation: look-around 2s ease-in-out infinite; }
        .thinking .aura { fill: #8b5cf6; animation-duration: 1.5s; }
        .thinking .visor-glass { stroke: #8b5cf6; filter: drop-shadow(0 0 15px rgba(139,92,246,0.5)); }
        .thinking .iris-color { fill: #8b5cf6; transition: fill 0.3s ease; } 
        .thinking #dynamic-mouth { fill: #8b5cf6; }
        
        /* Interactive 3D tilt applied via JS */
        #avatar-svg {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* Chat scrollbar */
        #chat-log::-webkit-scrollbar { width: 6px; }
        #chat-log::-webkit-scrollbar-track { background: transparent; }
        #chat-log::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 20px; }

        /* Status Dot */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-idle { background-color: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
        .status-listening { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-speaking { background-color: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
        .status-error { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
    </style>
</head>
<body class="flex flex-col items-center justify-between">

    <!-- Top Bar -->
    <header class="w-full p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex justify-between items-center z-10">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-robot text-blue-400 text-xl"></i>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">Gemini AI Buddy</h1>
        </div>
        <div class="flex items-center text-sm font-medium text-slate-300">
            <span id="status-indicator" class="status-dot status-idle"></span>
            <span id="status-text">Idle</span>
            <button id="key-btn" class="ml-4 text-slate-400 hover:text-blue-400" title="Gemini API key"><i class="fa-solid fa-key"></i></button>
        </div>
    </header>

    <!-- API Key Bar (shown when no key is saved) -->
    <form id="key-form" class="hidden w-full max-w-4xl px-4 py-3 flex flex-wrap items-center gap-2 text-sm text-slate-300">
        <label for="key-input">Gemini API key:</label>
        <input id="key-input" type="password" autocomplete="off" placeholder="Paste your key from aistudio.google.com" class="flex-1 min-w-[12rem] bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg px-4 py-2">Save</button>
        <span class="w-full text-xs text-slate-500">Stored only in this browser.</span>
    </form>

    <!-- Main Content Area -->
    <main class="flex-1 w-full max-w-4xl flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Avatar Section -->
        <section class="flex-1 flex flex-col items-center justify-center p-8 min-h-[40vh]">
            <div id="avatar" class="avatar-container w-80 h-80 relative drop-shadow-2xl z-10">
                <svg id="avatar-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="w-full h-full overflow-visible">
                    <defs>
                        <radialGradient id="aura-grad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="currentColor" stop-opacity="0.4" />
                            <stop offset="100%" stop-color="currentColor" stop-opacity="0" />
                        </radialGradient>
                        <linearGradient id="head-base" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#334155"/>
                            <stop offset="100%" stop-color="#0f172a"/>
                        </linearGradient>
                        <linearGradient id="visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#020617"/>
                            <stop offset="50%" stop-color="#0f172a"/>
                            <stop offset="100%" stop-color="#020617"/>
                        </linearGradient>
                        <linearGradient id="glass-glare" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                        </linearGradient>
                    </defs>

                    <!-- Background Aura -->
                    <circle class="aura text-blue-500" cx="200" cy="200" r="180" fill="url(#aura-grad)" />

                    <!-- Floating Rings (Neck/Base) -->
                    <ellipse cx="200" cy="320" rx="70" ry="20" fill="none" stroke="#334155" stroke-width="4" />
                    <ellipse cx="200" cy="335" rx="50" ry="15" fill="none" stroke="#475569" stroke-width="3" />

                    <!-- Main Head -->
                    <g id="robot-head">
                        <!-- Head Shell -->
                        <rect x="70" y="50" width="260" height="230" rx="90" fill="url(#head-base)" stroke="#475569" stroke-width="2"/>
                        
                        <!-- Ears/Side Nodes -->
                        <g class="ears">
                            <rect x="40" y="120" width="40" height="90" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
                            <rect x="320" y="120" width="40" height="90" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
                            <!-- Ear Cores -->
                            <rect x="45" y="145" width="10" height="40" rx="5" fill="#38bdf8" />
                            <rect x="345" y="145" width="10" height="40" rx="5" fill="#38bdf8" />
                        </g>

                        <!-- Visor Outer -->
                        <rect class="visor-glass" x="90" y="90" width="220" height="150" rx="50" fill="url(#visor-grad)" stroke="#1e293b" stroke-width="4" />
                        
                        <!-- Visor Glare -->
                        <path d="M 100 140 Q 200 90 300 140 L 300 100 Q 200 80 100 100 Z" fill="url(#glass-glare)"/>

                        <!-- Face Elements (Translate dynamically for 3D effect) -->
                        <g id="face-elements" class="eye-group">
                            <!-- Eyes Base -->
                            <g class="eyes-container">
                                <!-- Left Eye -->
                                <clipPath id="left-eye-clip">
                                    <rect x="120" y="110" width="50" height="60" rx="25" />
                                </clipPath>
                                <g class="eye" style="transform-origin: 145px 140px; transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);">
                                    <rect x="120" y="110" width="50" height="60" rx="25" fill="#020617" stroke="#334155" stroke-width="3"/>
                                    <!-- Group for parallax movement -->
                                    <g id="pupil-l-group" clip-path="url(#left-eye-clip)">
                                        <circle class="iris-color" cx="145" cy="140" r="16" fill="#38bdf8" />
                                        <circle cx="145" cy="140" r="8" fill="#020617" />
                                        <circle cx="150" cy="133" r="4" fill="#ffffff" opacity="0.9" />
                                    </g>
                                </g>

                                <!-- Right Eye -->
                                <clipPath id="right-eye-clip">
                                    <rect x="230" y="110" width="50" height="60" rx="25" />
                                </clipPath>
                                <g class="eye" style="transform-origin: 255px 140px; transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);">
                                    <rect x="230" y="110" width="50" height="60" rx="25" fill="#020617" stroke="#334155" stroke-width="3"/>
                                    <!-- Group for parallax movement -->
                                    <g id="pupil-r-group" clip-path="url(#right-eye-clip)">
                                        <circle class="iris-color" cx="255" cy="140" r="16" fill="#38bdf8" />
                                        <circle cx="255" cy="140" r="8" fill="#020617" />
                                        <circle cx="260" cy="133" r="4" fill="#ffffff" opacity="0.9" />
                                    </g>
                                </g>
                            </g>

                            <!-- Mouth -->
                            <path id="dynamic-mouth" d="M 150 190 C 175 192 225 192 250 190 C 225 202 175 202 150 190 Z" fill="#38bdf8" />
                        </g>
                    </g>
                </svg>
            </div>
            
            <div class="mt-12 z-20">
                <button id="talk-btn" class="group relative inline-flex items-center justify-center px-8 py-4 font-bold text-white transition-all duration-200 bg-blue-600 font-pj rounded-xl hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)]">
                    <i id="talk-btn-icon" class="fa-solid fa-satellite-dish mr-3 text-xl group-hover:scale-110 transition-transform"></i>
                    <span id="talk-btn-text">Start Live Session</span>
                </button>
            </div>
        </section>

        <!-- Chat Log Section -->
        <section class="flex-1 bg-slate-800/50 border-l border-slate-700/50 flex flex-col w-full h-[60vh] md:h-auto">
            <div id="chat-log" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Initial Greeting -->
                <div class="flex items-start">
                    <div class="bg-blue-600 text-white rounded-2xl rounded-tl-none px-5 py-3 max-w-[85%] shadow-md">
                        I am connected and ready! Click the button to start a real-time voice session.
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Error Toast Notification -->
    <div id="error-toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="error-message">An error occurred.</span>
    </div>

    <script type="module">
        const API_KEY = ""; // The Canvas environment automatically injects the key here
        
        const avatar = document.getElementById('avatar');
        const talkBtn = document.getElementById('talk-btn');
        const talkBtnText = document.getElementById('talk-btn-text');
        const talkBtnIcon = document.getElementById('talk-btn-icon');
        const chatLog = document.getElementById('chat-log');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const errorToast = document.getElementById('error-toast');
        const errorMessage = document.getElementById('error-message');

        // Outside Canvas nothing injects API_KEY, so ask for one and keep it in this browser
        const keyForm = document.getElementById('key-form');
        const keyInput = document.getElementById('key-input');
        function getApiKey() {
            if (API_KEY) return API_KEY;
            try { return localStorage.getItem('geminiApiKey') || ""; } catch (e) { return ""; }
        }
        function showKeyForm() {
            keyForm.classList.remove('hidden');
            keyInput.focus();
        }
        keyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const key = keyInput.value.trim();
            if (!key) return;
            try { localStorage.setItem('geminiApiKey', key); } catch (err) {}
            keyInput.value = "";
            keyForm.classList.add('hidden');
        });
        document.getElementById('key-btn').addEventListener('click', () => keyForm.classList.toggle('hidden'));
        if (!getApiKey()) showKeyForm();

        async function callGemini(model, payload) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(getApiKey())}`;
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                if (res.status === 400 || res.status === 401 || res.status === 403) showKeyForm();
                throw new Error(data.error?.message || `Gemini returned ${res.status}`);
            }
            return data;
        }

        window.addEventListener('error', (e) => showError("Error: " + e.message));
        window.addEventListener('unhandledrejection', (e) => showError("Network: " + (e.reason?.message || e.reason || "Connection blocked")));

        // Setup Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
        } else {
            showError("Speech Recognition is not supported in this browser.");
        }

        // Setup Web Audio for Lip Syncing
        let outputAudioContext = null;
        let outputNode = null;
        let analyser = null;
        let dataArray = null;

        function initAudio() {
            if (!outputAudioContext) {
                outputAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                outputNode = outputAudioContext.createGain();
                outputNode.connect(outputAudioContext.destination);
                
                analyser = outputAudioContext.createAnalyser();
                analyser.fftSize = 256;
                outputNode.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (outputAudioContext.state === 'suspended') {
                outputAudioContext.resume();
            }
        }

        const visemeMap = { 'REST': { w: 100, t: 191, b: 193 } };
        let targetMouth = { ...visemeMap['REST'] };
        let currentMouth = { ...visemeMap['REST'] };
        let isSpeaking = false;

        // Start listening to user
        talkBtn.addEventListener('click', async () => {
            if (!recognition) return showError("Speech recognition not available.");
            if (!getApiKey()) {
                showKeyForm();
                return showError("Enter your Gemini API key first.");
            }

            initAudio();
            talkBtn.disabled = true;
            updateUIState('listening');
            
            try {
                recognition.start();
            } catch(e) {
                showError("Microphone error. Please try again.");
                resetUI();
            }
        });

        if (recognition) {
            let gotResult = false;
            recognition.onstart = () => { gotResult = false; };
            // Ending without a result (silence, mic stopped) must not leave the button disabled
            recognition.onend = () => { if (!gotResult) resetUI(); };

            recognition.onresult = async (event) => {
                gotResult = true;
                const transcript = event.results[0][0].transcript;
                appendMessage(transcript, 'user');
                updateUIState('thinking');
                
                try {
                    await processConversation(transcript);
                } catch (err) {
                    console.error(err);
                    showError("Failed: " + err.message);
                    resetUI();
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    showError("Microphone error: " + event.error);
                }
                resetUI();
            };
        }

        async function processConversation(userText) {
            // 1. Ask Gemini 3 Flash for a response
            const chatPayload = {
                contents: [{ parts: [{ text: userText }] }],
                systemInstruction: { parts: [{ text: "You are an expressive, interactive AI avatar named Gemini. Keep your responses exceptionally conversational, snappy, and concise. Act like a fun human on a phone call. Max 2-3 sentences." }] }
            };
            
            const chatData = await callGemini('gemini-3-flash-preview', chatPayload);

            const aiText = chatData.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("").trim();
            if (!aiText) throw new Error("No response from AI.");
            
            appendMessage(aiText, 'model');

            // 2. Convert response to Speech using Gemini TTS
            const ttsPayload = {
                contents: [{ parts: [{ text: aiText }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Zephyr' } } }
                }
            };

            const ttsData = await callGemini('gemini-2.5-flash-preview-tts', ttsPayload);
            
            const audioBase64 = ttsData.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
            if (!audioBase64) throw new Error("Failed to generate audio.");

            // 3. Play the audio and animate mouth
            await playRawPCM(audioBase64);
        }

        async function playRawPCM(base64Audio) {
            updateUIState('speaking');
            
            // Decode base64 to ArrayBuffer, stripping odd bytes
            const binaryString = atob(base64Audio);
            const len = Math.floor(binaryString.length / 2) * 2;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
            
            // Convert to Int16 and fill AudioBuffer
            const dataInt16 = new Int16Array(bytes.buffer);
            const sampleRate = 24000; // Gemini TTS standard
            const buffer = outputAudioContext.createBuffer(1, dataInt16.length, sampleRate);
            const channelData = buffer.getChannelData(0);
            
            for (let i = 0; i < dataInt16.length; i++) {
                channelData[i] = dataInt16[i] / 32768.0;
            }
            
            const source = outputAudioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(outputNode);
            
            source.onended = () => {
                isSpeaking = false;
                resetUI();
            };
            
            isSpeaking = true;
            source.start(0);
        }

        // --- UI & Animation Helpers ---

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = "flex w-full " + (sender === 'user' ? "justify-end" : "justify-start");
            
            const bubble = document.createElement('div');
            bubble.className = "px-5 py-3 max-w-[85%] shadow-md " + 
                (sender === 'user' 
                    ? "bg-slate-700 text-white rounded-2xl rounded-tr-none" 
                    : "bg-blue-600 text-white rounded-2xl rounded-tl-none");
            bubble.innerText = text;
            
            div.appendChild(bubble);
            chatLog.appendChild(div);
            chatLog.scrollTo({ top: chatLog.scrollHeight, behavior: 'smooth' });
        }

        function updateUIState(state) {
            statusIndicator.className = 'status-dot';
            avatar.classList.remove('listening', 'thinking', 'speaking');
            
            if (state === 'listening') {
                statusIndicator.classList.add('status-listening');
                statusText.innerText = 'Listening...';
                avatar.classList.add('listening');
                talkBtnText.innerText = "Speak Now...";
                talkBtnIcon.className = "fa-solid fa-microphone-lines mr-3 text-xl animate-pulse";
                talkBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
            } else if (state === 'thinking') {
                statusIndicator.classList.add('status-idle');
                statusText.innerText = 'Thinking...';
                avatar.classList.add('thinking');
                talkBtnText.innerText = "Processing...";
                talkBtnIcon.className = "fa-solid fa-microchip mr-3 text-xl";
                talkBtn.classList.replace('bg-emerald-600', 'bg-purple-600');
            } else if (state === 'speaking') {
                statusIndicator.classList.add('status-speaking');
                statusText.innerText = 'Speaking...';
                avatar.classList.add('speaking');
                talkBtnText.innerText = "Avatar Speaking...";
                talkBtnIcon.className = "fa-solid fa-volume-high mr-3 text-xl";
                talkBtn.classList.replace('bg-purple-600', 'bg-amber-500');
            }
        }

        function resetUI() {
            statusIndicator.className = 'status-dot status-idle';
            statusText.innerText = 'Ready';
            avatar.classList.remove('listening', 'thinking', 'speaking');
            talkBtn.disabled = false;
            talkBtnText.innerText = "Click to Speak";
            talkBtnIcon.className = "fa-solid fa-microphone mr-3 text-xl group-hover:scale-110 transition-transform";
            
            // Reset button colors
            talkBtn.className = "group relative inline-flex items-center justify-center px-8 py-4 font-bold text-white transition-all duration-200 bg-blue-600 font-pj rounded-xl hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)]";
        }

        let errorTimer = null;
        function showError(msg) {
            errorMessage.innerText = msg;
            errorToast.classList.remove('opacity-0', 'pointer-events-none');
            clearTimeout(errorTimer);
            errorTimer = setTimeout(() => {
                errorToast.classList.add('opacity-0', 'pointer-events-none');
            }, 6000);
        }

        // 3D Parallax Mouse Tracking
        document.addEventListener('mousemove', (e) => {
            const svg = document.getElementById('avatar-svg');
            const face = document.getElementById('face-elements');
            if(!svg || !face) return;
            
            const rect = svg.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const moveX = (e.clientX - centerX) / (window.innerWidth / 2);
            const moveY = (e.clientY - centerY) / (window.innerHeight / 2);
            
            svg.style.transform = `perspective(1000px) rotateX(${-moveY * 12}deg) rotateY(${moveX * 12}deg)`;
            face.style.transform = `translate(${moveX * 15}px, ${moveY * 7.5}px)`;
            
            const pupilL = document.getElementById('pupil-l-group');
            const pupilR = document.getElementById('pupil-r-group');
            if(pupilL && pupilR) {
                pupilL.style.transform = `translate(${moveX * 6}px, ${moveY * 6}px)`;
                pupilR.style.transform = `translate(${moveX * 6}px, ${moveY * 6}px)`;
            }
        });

        // Blinking Animation
        function blink() {
            const eyes = document.querySelectorAll('.eye');
            eyes.forEach(eye => eye.style.transform = 'scaleY(0.1)'); 
            setTimeout(() => {
                eyes.forEach(eye => eye.style.transform = 'scaleY(1)'); 
            }, 120);
            setTimeout(blink, 2000 + Math.random() * 4000);
        }
        blink();

        // Audio-Driven Lip Sync Animation Loop
        function animateFace() {
            requestAnimationFrame(animateFace);
            
            if (isSpeaking && analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                
                let lowAvg = 0;
                let highAvg = 0;
                const half = Math.floor(dataArray.length / 2);
                
                for(let i = 0; i < half; i++) lowAvg += dataArray[i];
                for(let i = half; i < dataArray.length; i++) highAvg += dataArray[i];
                
                lowAvg = lowAvg / half;
                highAvg = highAvg / half;

                if (lowAvg > 8 || highAvg > 8) {
                    const openAmount = 191 + (lowAvg * 0.4); 
                    const widthAmount = 100 + (highAvg * 0.8) - (lowAvg * 0.2); 
                    
                    targetMouth = { 
                        w: Math.max(50, Math.min(180, widthAmount)), 
                        t: 190 - (openAmount - 190)/2, 
                        b: Math.min(235, openAmount) 
                    };
                } else {
                    targetMouth = visemeMap['REST'];
                }
            } else {
                targetMouth = visemeMap['REST'];
            }

            // Smooth Interpolation
            currentMouth.w += (targetMouth.w - currentMouth.w) * 0.35;
            currentMouth.t += (targetMouth.t - currentMouth.t) * 0.35;
            currentMouth.b += (targetMouth.b - currentMouth.b) * 0.35;

            const mouth = document.getElementById('dynamic-mouth');
            if (mouth) {
                const center = 200;
                const leftX = center - (currentMouth.w / 2);
                const rightX = center + (currentMouth.w / 2);
                const cpOffset = currentMouth.w * 0.25;

                const path = `M ${leftX} 190 
                              C ${leftX + cpOffset} ${currentMouth.t} ${rightX - cpOffset} ${currentMouth.t} ${rightX} 190 
                              C ${rightX - cpOffset} ${currentMouth.b} ${leftX + cpOffset} ${currentMouth.b} ${leftX} 190 Z`;
                mouth.setAttribute('d', path);
            }
        }
        
        animateFace();
        resetUI(); // Initialize button state
    </script>
</body>
</html>
