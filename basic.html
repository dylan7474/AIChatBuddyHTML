<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive AI Buddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Advanced Avatar Animations --- */
        @keyframes float-complex {
            0% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-12px) rotate(1deg); }
            66% { transform: translateY(-5px) rotate(-1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .avatar-container {
            animation: float-complex 8s ease-in-out infinite;
            perspective: 1000px;
        }

        /* Aura & Glows */
        @keyframes pulse-aura {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
            100% { transform: scale(1); opacity: 0.3; }
        }
        .aura {
            transform-origin: center;
            animation: pulse-aura 4s ease-in-out infinite;
            transition: fill 0.4s ease;
        }

        /* Mouth shape is set every frame from JS; only the colour transitions */
        #dynamic-mouth {
            transition: fill 0.3s ease;
        }

        /* Visor Styles */
        .visor-glass {
            transition: all 0.4s ease;
        }

        /* State: Listening */
        .listening .aura { fill: #10b981; animation-duration: 2s; }
        .listening .visor-glass { stroke: #10b981; stroke-width: 3px; filter: drop-shadow(0 0 15px rgba(16,185,129,0.5)); }
        .listening .iris-color { fill: #10b981; transition: fill 0.3s ease; }
        .listening #dynamic-mouth { fill: #10b981; }
        
        /* State: Thinking */
        @keyframes look-around {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }
        .thinking .eye-group { animation: look-around 2s ease-in-out infinite; }
        .thinking .aura { fill: #8b5cf6; animation-duration: 1.5s; }
        .thinking .visor-glass { stroke: #8b5cf6; filter: drop-shadow(0 0 15px rgba(139,92,246,0.5)); }
        .thinking .iris-color { fill: #8b5cf6; transition: fill 0.3s ease; } 
        .thinking #dynamic-mouth { fill: #8b5cf6; }
        
        /* Interactive 3D tilt applied via JS */
        #avatar-svg {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* Chat scrollbar */
        #chat-log::-webkit-scrollbar { width: 6px; }
        #chat-log::-webkit-scrollbar-track { background: transparent; }
        #chat-log::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 20px; }

        /* Status Dot */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-idle { background-color: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
        .status-listening { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-speaking { background-color: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
        .status-error { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
    </style>
</head>
<body class="flex flex-col items-center justify-between">

    <!-- Top Bar -->
    <header class="w-full p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex justify-between items-center z-10">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-robot text-blue-400 text-xl"></i>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">Gemini AI Buddy</h1>
        </div>
        <div class="flex items-center text-sm font-medium text-slate-300">
            <span id="status-indicator" class="status-dot status-idle"></span>
            <span id="status-text">Idle</span>
            <button id="key-btn" class="ml-4 text-slate-400 hover:text-blue-400" title="Gemini API key"><i class="fa-solid fa-key"></i></button>
        </div>
    </header>

    <!-- API Key Bar (shown when no key is saved) -->
    <form id="key-form" class="hidden w-full max-w-4xl px-4 py-3 flex flex-wrap items-center gap-2 text-sm text-slate-300">
        <label for="key-input">Gemini API key:</label>
        <input id="key-input" type="password" autocomplete="off" placeholder="Paste your key from aistudio.google.com" class="flex-1 min-w-[12rem] bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg px-4 py-2">Save</button>
        <span class="w-full text-xs text-slate-500">Stored only in this browser.</span>
    </form>

    <!-- Main Content Area -->
    <main class="flex-1 w-full max-w-4xl flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Avatar Section -->
        <section class="flex-1 flex flex-col items-center justify-center p-8 min-h-[40vh]">
            <div id="avatar" class="avatar-container w-80 h-80 relative drop-shadow-2xl z-10">
                <svg id="avatar-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="w-full h-full overflow-visible">
                    <defs>
                        <radialGradient id="aura-grad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="currentColor" stop-opacity="0.4" />
                            <stop offset="100%" stop-color="currentColor" stop-opacity="0" />
                        </radialGradient>
                        <linearGradient id="head-base" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#334155"/>
                            <stop offset="100%" stop-color="#0f172a"/>
                        </linearGradient>
                        <linearGradient id="visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#020617"/>
                            <stop offset="50%" stop-color="#0f172a"/>
                            <stop offset="100%" stop-color="#020617"/>
                        </linearGradient>
                        <linearGradient id="glass-glare" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                        </linearGradient>
                    </defs>

                    <!-- Background Aura -->
                    <circle class="aura text-blue-500" cx="200" cy="200" r="180" fill="url(#aura-grad)" />

                    <!-- Floating Rings (Neck/Base) -->
                    <ellipse cx="200" cy="320" rx="70" ry="20" fill="none" stroke="#334155" stroke-width="4" />
                    <ellipse cx="200" cy="335" rx="50" ry="15" fill="none" stroke="#475569" stroke-width="3" />

                    <!-- Main Head -->
                    <g id="robot-head">
                        <!-- Head Shell -->
                        <rect x="70" y="50" width="260" height="230" rx="90" fill="url(#head-base)" stroke="#475569" stroke-width="2"/>
                        
                        <!-- Ears/Side Nodes -->
                        <g class="ears">
                            <rect x="40" y="120" width="40" height="90" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
                            <rect x="320" y="120" width="40" height="90" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
                            <!-- Ear Cores -->
                            <rect x="45" y="145" width="10" height="40" rx="5" fill="#38bdf8" />
                            <rect x="345" y="145" width="10" height="40" rx="5" fill="#38bdf8" />
                        </g>

                        <!-- Visor Outer -->
                        <rect class="visor-glass" x="90" y="90" width="220" height="150" rx="50" fill="url(#visor-grad)" stroke="#1e293b" stroke-width="4" />
                        
                        <!-- Visor Glare -->
                        <path d="M 100 140 Q 200 90 300 140 L 300 100 Q 200 80 100 100 Z" fill="url(#glass-glare)"/>

                        <!-- Face Elements (Translate dynamically for 3D effect) -->
                        <g id="face-elements" class="eye-group">
                            <!-- Eyes Base -->
                            <g class="eyes-container">
                                <!-- Left Eye -->
                                <clipPath id="left-eye-clip">
                                    <rect x="120" y="110" width="50" height="60" rx="25" />
                                </clipPath>
                                <g class="eye" style="transform-origin: 145px 140px; transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);">
                                    <rect x="120" y="110" width="50" height="60" rx="25" fill="#020617" stroke="#334155" stroke-width="3"/>
                                    <!-- Group for parallax movement -->
                                    <g id="pupil-l-group" clip-path="url(#left-eye-clip)">
                                        <circle class="iris-color" cx="145" cy="140" r="16" fill="#38bdf8" />
                                        <circle cx="145" cy="140" r="8" fill="#020617" />
                                        <circle cx="150" cy="133" r="4" fill="#ffffff" opacity="0.9" />
                                    </g>
                                </g>

                                <!-- Right Eye -->
                                <clipPath id="right-eye-clip">
                                    <rect x="230" y="110" width="50" height="60" rx="25" />
                                </clipPath>
                                <g class="eye" style="transform-origin: 255px 140px; transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);">
                                    <rect x="230" y="110" width="50" height="60" rx="25" fill="#020617" stroke="#334155" stroke-width="3"/>
                                    <!-- Group for parallax movement -->
                                    <g id="pupil-r-group" clip-path="url(#right-eye-clip)">
                                        <circle class="iris-color" cx="255" cy="140" r="16" fill="#38bdf8" />
                                        <circle cx="255" cy="140" r="8" fill="#020617" />
                                        <circle cx="260" cy="133" r="4" fill="#ffffff" opacity="0.9" />
                                    </g>
                                </g>
                            </g>

                            <!-- Mouth -->
                            <path id="dynamic-mouth" d="M 150 190 C 175 192 225 192 250 190 C 225 202 175 202 150 190 Z" fill="#38bdf8" />
                            <path id="mouth-inner" d="" fill="#020617" />
                        </g>
                    </g>
                </svg>
            </div>
            
            <div class="mt-12 z-20">
                <button id="mic-btn" class="group relative inline-flex items-center justify-center px-8 py-4 font-bold text-white transition-all duration-200 bg-blue-600 font-pj rounded-xl hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)]">
                    <i class="fa-solid fa-microphone mr-3 text-xl group-hover:scale-110 transition-transform"></i>
                    <span id="mic-btn-text">Tap to Speak</span>
                </button>
            </div>
        </section>

        <!-- Chat Log Section -->
        <section class="flex-1 bg-slate-800/50 border-l border-slate-700/50 flex flex-col w-full h-[60vh] md:h-auto">
            <div id="chat-log" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Initial Greeting -->
                <div class="flex items-start">
                    <div class="bg-blue-600 text-white rounded-2xl rounded-tl-none px-5 py-3 max-w-[85%] shadow-md">
                        Hi there! I'm your interactive AI buddy. Tap the microphone button and say something to me!
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Error Toast Notification -->
    <div id="error-toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="error-message">An error occurred.</span>
    </div>

    <script>
        // API Configurations
        const API_KEY = ""; // Keep empty as requested, environment injects it

        // Outside Canvas nothing injects API_KEY, so ask for one and keep it in this browser
        function getApiKey() {
            if (API_KEY) return API_KEY;
            try { return localStorage.getItem('geminiApiKey') || ""; } catch (e) { return ""; }
        }
        function geminiUrl(model) {
            return `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(getApiKey())}`;
        }

        // Application State
        let isListening = false;
        let isSpeaking = false;
        let chatHistory = []; // Stores context for LLM
        
        // Audio & Viseme Variables
        let audioPlayer = new window.Audio();
        let audioCtx, audioSource;
        let lipTrack = null; // mouth shape for every frame of the reply being played

        // DOM Elements
        const avatar = document.getElementById('avatar');
        const micBtn = document.getElementById('mic-btn');
        const micBtnText = document.getElementById('mic-btn-text');
        const chatLog = document.getElementById('chat-log');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const errorToast = document.getElementById('error-toast');
        const errorMessage = document.getElementById('error-message');
        const keyForm = document.getElementById('key-form');
        const keyInput = document.getElementById('key-input');

        function showKeyForm() {
            keyForm.classList.remove('hidden');
            keyInput.focus();
        }
        keyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const key = keyInput.value.trim();
            if (!key) return;
            try { localStorage.setItem('geminiApiKey', key); } catch (err) {}
            keyInput.value = "";
            keyForm.classList.add('hidden');
        });
        document.getElementById('key-btn').addEventListener('click', () => keyForm.classList.toggle('hidden'));
        if (!getApiKey()) showKeyForm();

        // Initialize Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                updateStatus('listening');
                avatar.classList.add('listening');
                micBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                micBtn.classList.replace('hover:bg-blue-500', 'hover:bg-emerald-500');
                micBtn.classList.replace('shadow-[0_0_20px_rgba(37,99,235,0.4)]', 'shadow-[0_0_20px_rgba(16,185,129,0.4)]');
                micBtnText.innerText = "Listening...";
                
                // Stop any current audio
                if (audioPlayer && !audioPlayer.paused) {
                    audioPlayer.pause();
                    isSpeaking = false;
                    avatar.classList.remove('speaking');
                }
            };

            recognition.onresult = async function(event) {
                const transcript = event.results[0][0].transcript;
                handleUserUtterance(transcript);
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error", event.error);
                if (event.error !== 'no-speech') {
                    showError(`Microphone error: ${event.error}`);
                }
                resetToIdle();
            };

            recognition.onend = function() {
                isListening = false;
                if (!isSpeaking && statusText.innerText !== 'Thinking...') {
                    resetToIdle();
                }
            };
        } else {
            showError("Your browser doesn't support speech recognition. Try Chrome.");
            micBtn.disabled = true;
            micBtnText.innerText = "Not Supported";
            micBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        // Event Listener for Mic Button
        micBtn.addEventListener('click', () => {
            if (!getApiKey()) {
                showKeyForm();
                return showError("Enter your Gemini API key first.");
            }
            // Initialize Audio Context on first user gesture to reduce latency later
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioSource = audioCtx.createMediaElementSource(audioPlayer);
                audioSource.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    console.error(e);
                }
            }
        });

        // Handles the text received from the user
        async function handleUserUtterance(text) {
            // Append user message to UI
            appendMessage(text, 'user');
            updateStatus('thinking');

            // Add to chat history for Gemini
            chatHistory.push({ role: "user", parts: [{ text: text }] });

            try {
                // Call Gemini for text response
                const llmResponseText = await callGeminiLLM(chatHistory);
                
                // Add model response to history
                chatHistory.push({ role: "model", parts: [{ text: llmResponseText }] });
                
                // Append bot message to UI
                appendMessage(llmResponseText, 'model');

                // Call Gemini TTS for voice response
                await playTTS(llmResponseText);

            } catch (error) {
                console.error(error);
                // Drop the unanswered turn so the next request isn't two user turns in a row
                if (chatHistory[chatHistory.length - 1]?.role === "user") chatHistory.pop();
                showError("Failed: " + error.message);
                resetToIdle();
            }
        }

        // Fetch text response from Gemini
        async function callGeminiLLM(history) {
            const payload = {
                contents: history,
                systemInstruction: {
                    parts: [{ text: "You are a friendly, concise, and interactive virtual companion. Speak casually and keep responses relatively short (1-3 sentences) so they sound natural when spoken out loud." }]
                }
            };

            const response = await fetchWithRetry(geminiUrl("gemini-3-flash-preview"), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if (result.candidates && result.candidates.length > 0) {
                return result.candidates[0].content.parts[0].text;
            } else {
                throw new Error("Invalid response from LLM");
            }
        }

        // Fetch and play TTS from Gemini
        async function playTTS(text) {
            updateStatus('speaking');
            avatar.classList.remove('listening');
            
            const payload = {
                contents: [{ parts: [{ text: text }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: "Puck" } // Puck is upbeat
                        }
                    }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            try {
                const response = await fetchWithRetry(geminiUrl("gemini-2.5-flash-preview-tts"), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                
                if (part?.inlineData?.data) {
                    const audioData = part.inlineData.data;
                    const mimeType = part.inlineData.mimeType; // usually audio/pcm;rate=24000
                    const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;

                    // Convert PCM to WAV
                    const pcmData = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    lipTrack = buildLipTrack(Float32Array.from(pcm16, (v) => v / 32768), sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);

                    // Setup Audio Context if not already done
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        audioSource = audioCtx.createMediaElementSource(audioPlayer);
                        audioSource.connect(audioCtx.destination);
                    }
                    
                    if (audioCtx.state === 'suspended') {
                        await audioCtx.resume();
                    }

                    // Play Audio
                    audioPlayer.src = audioUrl;
                    audioPlayer.playbackRate = 1.15; // Speed up speech slightly for snappier responses
                    
                    audioPlayer.onplay = () => {
                        isSpeaking = true;
                        avatar.classList.add('speaking');
                    };

                    audioPlayer.onended = () => {
                        isSpeaking = false;
                        avatar.classList.remove('speaking');
                        resetToIdle();
                        URL.revokeObjectURL(audioUrl);
                    };

                    audioPlayer.play();
                } else {
                    throw new Error("No audio data returned");
                }
            } catch (error) {
                console.error("TTS Error:", error);
                showError("Could not generate voice: " + error.message);
                resetToIdle();
            }
        }

        // Convert Base64 to ArrayBuffer
        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Convert PCM 16-bit to WAV Blob
        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1; // Gemini TTS is mono
            const byteRate = sampleRate * numChannels * 2;
            const blockAlign = numChannels * 2;
            
            const buffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(buffer);
            
            // RIFF chunk descriptor
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcm16.length * 2, true);
            writeString(view, 8, 'WAVE');
            
            // fmt sub-chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // Subchunk1Size
            view.setUint16(20, 1, true); // AudioFormat (1 for PCM)
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true); // BitsPerSample
            
            // data sub-chunk
            writeString(view, 36, 'data');
            view.setUint32(40, pcm16.length * 2, true);
            
            // Write PCM samples
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) {
                view.setInt16(offset, pcm16[i], true); // true for little-endian
            }
            
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // Generic Fetch with basic retry logic
        async function fetchWithRetry(url, options, retries = 2) {
            for (let i = 0; i <= retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const data = await response.json().catch(() => ({}));
                        const error = new Error(data.error?.message || `Gemini returned ${response.status}`);
                        // A bad key or request won't get better by retrying
                        if (response.status >= 400 && response.status < 500 && response.status !== 429) {
                            if (response.status === 400 || response.status === 401 || response.status === 403) showKeyForm();
                            error.noRetry = true;
                        }
                        throw error;
                    }
                    return response;
                } catch (error) {
                    if (i === retries || error.noRetry) throw error;
                    // Exponential backoff
                    await new Promise(res => setTimeout(res, Math.pow(2, i) * 1000));
                }
            }
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = "flex w-full " + (sender === 'user' ? "justify-end" : "justify-start");
            
            const bubble = document.createElement('div');
            bubble.className = "px-5 py-3 max-w-[85%] shadow-md " + 
                (sender === 'user' 
                    ? "bg-slate-700 text-white rounded-2xl rounded-tr-none" 
                    : "bg-blue-600 text-white rounded-2xl rounded-tl-none");
            bubble.innerText = text;
            
            div.appendChild(bubble);
            chatLog.appendChild(div);
            
            // Auto scroll to bottom
            chatLog.scrollTo({
                top: chatLog.scrollHeight,
                behavior: 'smooth'
            });
        }

        function updateStatus(status) {
            statusIndicator.className = 'status-dot'; // Reset
            avatar.classList.remove('listening', 'thinking', 'speaking'); // Clear states
            
            switch(status) {
                case 'listening':
                    statusIndicator.classList.add('status-listening');
                    statusText.innerText = 'Listening...';
                    avatar.classList.add('listening');
                    break;
                case 'thinking':
                    statusIndicator.classList.add('status-idle');
                    statusIndicator.style.animation = 'blink 1s infinite';
                    statusText.innerText = 'Thinking...';
                    avatar.classList.add('thinking');
                    break;
                case 'speaking':
                    statusIndicator.classList.add('status-speaking');
                    statusIndicator.style.animation = 'none';
                    statusText.innerText = 'Speaking';
                    avatar.classList.add('speaking');
                    break;
                default: // idle
                    statusIndicator.classList.add('status-idle');
                    statusIndicator.style.animation = 'none';
                    statusText.innerText = 'Idle';
            }
        }

        function resetToIdle() {
            updateStatus('idle');
            micBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
            micBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-blue-500');
            micBtn.classList.replace('shadow-[0_0_20px_rgba(16,185,129,0.4)]', 'shadow-[0_0_20px_rgba(37,99,235,0.4)]');
            micBtnText.innerText = "Tap to Speak";
        }

        let errorTimer = null;
        function showError(msg) {
            errorMessage.innerText = msg;
            errorToast.classList.remove('opacity-0', 'pointer-events-none');
            clearTimeout(errorTimer);
            errorTimer = setTimeout(() => {
                errorToast.classList.add('opacity-0', 'pointer-events-none');
            }, 4000);
        }

        // --- Interactive 3D Face Tracking ---
        document.addEventListener('mousemove', (e) => {
            const svg = document.getElementById('avatar-svg');
            const face = document.getElementById('face-elements');
            if(!svg || !face) return;
            
            const rect = svg.getBoundingClientRect();
            // Calculate center of the SVG relative to the viewport
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Calculate normalized distance from center (-1 to 1)
            const moveX = (e.clientX - centerX) / (window.innerWidth / 2);
            const moveY = (e.clientY - centerY) / (window.innerHeight / 2);
            
            // Limit the intensity of the movement
            const maxTilt = 12; // Degrees
            const maxFacePan = 15; // Pixels

            // Tilt the entire head container slightly
            svg.style.transform = `perspective(1000px) rotateX(${-moveY * maxTilt}deg) rotateY(${moveX * maxTilt}deg)`;
            
            // Parallax shift the face elements to create depth inside the visor
            face.style.transform = `translate(${moveX * maxFacePan}px, ${moveY * maxFacePan * 0.5}px)`;
            
            // Track pupils independently for more depth
            const pupilPan = 6;
            const pupilL = document.getElementById('pupil-l-group');
            const pupilR = document.getElementById('pupil-r-group');
            if(pupilL && pupilR) {
                pupilL.style.transform = `translate(${moveX * pupilPan}px, ${moveY * pupilPan}px)`;
                pupilR.style.transform = `translate(${moveX * pupilPan}px, ${moveY * pupilPan}px)`;
            }
        });

        // --- Avatar Lip Sync & Blinking Logic ---

        // Mouth controls, each 0..1: open = jaw drop, wide = stretched ("ee", "s"), round = pursed ("oo", "oh")
        const MOUTH_REST = { open: 0, wide: 0, round: 0 };
        let currentMouth = { ...MOUTH_REST };

        // --- Lip Sync ---
        // The whole reply is decoded before it plays, so the mouth shapes are worked out
        // up front from the audio: loudness drives the jaw, and where the energy sits
        // (low for "oo"/"oh", high for "ee"/"s") sets how wide or round the lips are.
        const LIP_FPS = 100;
        const LIP_LEAD = 0.04; // seconds the mouth moves ahead of the sound, as in real speech
        const clamp01 = (v) => Math.min(1, Math.max(0, v));

        function buildLipTrack(samples, sampleRate) {
            const hop = Math.round(sampleRate / LIP_FPS);
            const frames = Math.floor(samples.length / hop);
            const poleA = (hz) => Math.exp(-2 * Math.PI * hz / sampleRate);
            const a900 = poleA(900), a1500 = poleA(1500), a3000 = poleA(3000);
            const rms = new Float32Array(frames);
            const lowFrac = new Float32Array(frames);    // share of energy below ~900 Hz ("oo", "oh")
            const brightFrac = new Float32Array(frames); // share above ~1.5 kHz ("ee", "ih")
            const hissFrac = new Float32Array(frames);   // share above ~3 kHz ("s", "sh", "f")
            let lp900 = 0, lp1500 = 0, lp3000 = 0;
            for (let f = 0; f < frames; f++) {
                let e = 0, eLow = 0, eBright = 0, eHiss = 0;
                for (let i = f * hop; i < (f + 1) * hop; i++) {
                    const x = samples[i];
                    lp900 = x + a900 * (lp900 - x);   // one-pole low-pass filters
                    lp1500 = x + a1500 * (lp1500 - x);
                    lp3000 = x + a3000 * (lp3000 - x);
                    e += x * x;
                    eLow += lp900 * lp900;
                    eBright += (x - lp1500) * (x - lp1500);
                    eHiss += (x - lp3000) * (x - lp3000);
                }
                rms[f] = Math.sqrt(e / hop);
                lowFrac[f] = eLow / (e + 1e-12);
                brightFrac[f] = eBright / (e + 1e-12);
                hissFrac[f] = eHiss / (e + 1e-12);
            }

            // Everything is judged against this reply itself, so any voice or volume works:
            // its 90th-percentile loudness opens the mouth fully, and lips go wide or round
            // when a frame is brighter or darker than the voice usually is
            const pct = (arr, p) => {
                const sorted = Array.from(arr).sort((a, b) => a - b);
                return sorted[Math.floor((sorted.length - 1) * p)] || 0;
            };
            const ref = Math.max(pct(rms, 0.9), 1e-4);
            const voiced = (arr) => arr.filter((_, f) => rms[f] > ref * 0.3);
            const vLow = voiced(lowFrac), vBright = voiced(brightFrac);
            const lowMid = pct(vLow, 0.5), lowTop = pct(vLow, 0.9);
            const brightMid = pct(vBright, 0.5), brightTop = pct(vBright, 0.9);

            const track = new Array(frames);
            let open = 0, wide = 0, round = 0;
            for (let f = 0; f < frames; f++) {
                const loud = rms[f] / ref;
                let o = Math.pow(clamp01((loud - 0.1) / 0.8), 0.75);
                let w = 0, r = 0;
                if (loud > 0.1) {
                    w = clamp01((brightFrac[f] - brightMid) / (brightTop - brightMid + 1e-6));
                    r = clamp01((lowFrac[f] - lowMid) / (lowTop - lowMid + 1e-6)) * (1 - w);
                    if (hissFrac[f] > 0.3) { o *= 0.45; w = 1; } // hissy sounds go through nearly closed teeth
                }
                // Opens fast and closes a little slower, so syllables read clearly without flicker
                open += (o - open) * (o > open ? 0.6 : 0.4);
                wide += (w - wide) * 0.3;
                round += (r - round) * 0.3;
                track[f] = { open, wide, round };
            }
            return track;
        }

        // A lens between two corners; c near 1 gives a round "o", lower gives a flatter slit
        function lensPath(cx, cy, hw, top, bottom, c) {
            const yt = cy + (top - cy) * 4 / 3;     // control points that make the curve peak at top/bottom
            const yb = cy + (bottom - cy) * 4 / 3;
            const l = cx - hw, r = cx + hw, dx = hw * c;
            return `M ${l} ${cy} C ${cx - dx} ${yt} ${cx + dx} ${yt} ${r} ${cy} C ${cx + dx} ${yb} ${cx - dx} ${yb} ${l} ${cy} Z`;
        }

        const mouthOuter = document.getElementById('dynamic-mouth');
        const mouthInner = document.getElementById('mouth-inner');

        function drawMouth({ open, wide, round }) {
            const cx = 200;
            const cy = 191 - 2 * (1 - open) * (1 - round);   // corners lift into a slight smile at rest
            const hw = 50 + wide * 14 - round * 22;           // half width: stretched for "ee", pursed for "oo"
            const up = 2 + open * 13 + round * 7;
            const down = 6 + open * 26 + round * 7;
            const c = 0.55 + round * 0.4;
            mouthOuter.setAttribute('d', lensPath(cx, cy, hw, cy - up, cy + down, c));

            // The dark inside shows once the lips part, leaving lips about 5 px thick
            const part = clamp01((open + round * 0.3 - 0.08) / 0.25);
            mouthInner.setAttribute('d', part > 0
                ? lensPath(cx, cy, Math.max(0, hw - 11), cy - Math.max(0, up - 6) * part, cy + Math.max(0, down - 10) * part, Math.min(0.95, c + 0.15))
                : '');
        }

        let lastFrameTime = performance.now();
        function animateFace(now = performance.now()) {
            requestAnimationFrame(animateFace);
            const dt = Math.min(0.1, Math.max(0, (now - lastFrameTime) / 1000));
            lastFrameTime = now;

            let target = MOUTH_REST;
            if (isSpeaking && lipTrack) {
                // Position in the reply being heard now; the player runs faster than real time
                const rate = audioPlayer.playbackRate || 1;
                const latency = audioCtx ? (audioCtx.outputLatency || audioCtx.baseLatency || 0) : 0;
                const heard = audioPlayer.currentTime + (LIP_LEAD - latency) * rate;
                const f = Math.floor(heard * LIP_FPS);
                if (f >= 0 && f < lipTrack.length) target = lipTrack[f];
            }

            // Light smoothing to hide the 10 ms steps; the track itself is already smoothed
            const k = 1 - Math.exp(-dt / 0.025);
            for (const key in currentMouth) currentMouth[key] += (target[key] - currentMouth[key]) * k;
            drawMouth(currentMouth);
        }

        function blink() {
            const eyes = document.querySelectorAll('.eye');
            // Close eyes (squash vertically for a digital blink effect)
            eyes.forEach(eye => eye.style.transform = 'scaleY(0.1)'); 
            
            // Open eyes quickly
            setTimeout(() => {
                eyes.forEach(eye => eye.style.transform = 'scaleY(1)'); 
            }, 120);
            
            // Randomly schedule next blink (between 2 and 6 seconds)
            setTimeout(blink, 2000 + Math.random() * 4000);
        }
        
        // Start random blinking
        blink();
        
        // Start continuous mouth animation loop
        animateFace();

    </script>
</body>
</html>
